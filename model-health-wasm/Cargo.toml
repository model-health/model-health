[package]
name = "model-health-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
model-health-core = { path = "../model-health-core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
console_error_panic_hook = "0.1"
log = { workspace = true }
wasm-logger = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "Storage",
]

[features]
default = ["production"]
development = ["model-health-core/development"]
production = ["model-health-core/production"]

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Single codegen unit for better optimization

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[lints.rust]
warnings = "deny"
# Allow unsafe code for WASM interop (similar to FFI)
unused_must_use = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
