name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write  # Required for npm provenance

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Verify dist directory exists
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Error: dist directory not found"
            echo "This workflow should only run after the build workflow has pushed artifacts"
            ls -la
            exit 1
          fi
          
          if [ ! -f "dist/package.json" ]; then
            echo "❌ Error: package.json not found in dist"
            ls -la dist/
            exit 1
          fi
          
          echo "✅ dist directory verified"
      
      - name: Verify version matches tag
        working-directory: dist
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${{ steps.version.outputs.version }}
          
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Error: package.json version ($PACKAGE_VERSION) doesn't match tag ($TAG_VERSION)"
            exit 1
          fi
          
          echo "✅ Version verified: $PACKAGE_VERSION"
      
      - name: Publish to npm with provenance
        working-directory: dist
        run: |
          echo "Publishing @modelhealth/sdk@${{ steps.version.outputs.version }} to npm..."
          npm publish --access public --provenance
          echo "✅ Successfully published to npm"
